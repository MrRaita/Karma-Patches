name: Build patches
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          # Morphe paketleri GitHub Packages'tan geliyorsa şablondaki ortam değişkenlerini kullan
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nowtv-patches
          path: patches/build/libs/*
